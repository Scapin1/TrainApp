# Project-wide Gradle settings.

# Kotlin version
kotlin.version=2.0.21

# Android Gradle Plugin version
agp.version=8.7.0

# Compose BOM version
compose.bom.version=2024.10.00

# Room version
room.version=2.6.1

# Hilt version (unused for now)
# hilt.version=2.55

# KSP version
ksp.version=2.0.21-1.0.28

# Navigation version
navigation.version=2.7.7

# WorkManager version
workmanager.version=2.9.0

# Coroutines version
coroutines.version=1.8.0

# Lifecycle version
lifecycle.version=2.7.0

# Vico version - TODO: Find working version or replace with Compose Canvas
# vico.version=0.6.0

# Material3 version
material3.version=1.2.1

# Accompanist version (for permissions, etc.)
accompanist.version=0.32.0

# Kotlinx Serialization
serialization.version=1.6.3

# Coil version (image loading)
coil.version=2.5.0

# Okio (for backup I/O)
okio.version=3.6.0

# JDK 17
org.gradle.java.installations.auto-detect=false
org.gradle.java.installations.fromEnv=JAVA_HOME

# Gradle JVM args
org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8

# Parallel builds
org.gradle.parallel=true
org.gradle.configureondemand=true

# Android
android.nonTransitiveRClass=true
android.enableR8.fullMode=true
android.useAndroidX=true

# KSP
ksp.incremental=true
ksp.useKotlinGradlePluginApi=true
# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true
